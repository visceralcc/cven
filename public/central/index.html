<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — CVEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-hover: #f6f8fa;
    --border: #dde1e8;
    --border-subtle: #e8ecf0;
    --text: #1a1b22;
    --text-mid: #4a4b58;
    --text-muted: #8a8b98;
    --accent-green: #4caf50;
    --accent-yellow: #f5a623;
    --dot-inactive: #ccd0d8;
    --radius: 12px;
    --radius-sm: 8px;
    --sans: 'Barlow', system-ui, sans-serif;
    --condensed: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    padding: 32px 24px 80px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .brand h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .brand .tag {
    font-family: var(--condensed);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    background: rgba(0, 0, 0, 0.04);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .refresh-btn {
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-mid);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .refresh-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .refresh-btn.spinning {
    opacity: 0.55;
    pointer-events: none;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  .grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
    align-items: flex-start;
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sidebar-item {
    display: block;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
  }

  .sidebar-item.selected {
    background: var(--surface);
    border-color: var(--border);
  }

  .sidebar-item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .sidebar-item-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .sidebar-item.selected .sidebar-item-name {
    font-weight: 600;
  }

  .sidebar-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-inactive);
    flex-shrink: 0;
  }

  .sidebar-dot.active { background: var(--accent-green); }

  .sidebar-item-desc {
    display: none;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .sidebar-tools {
    display: none;
    flex-direction: column;
    gap: 4px;
    margin-top: 8px;
    margin-left: 16px;
  }

  .sidebar-tool {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-mid);
    text-decoration: none;
  }

  .sidebar-tool:hover { text-decoration: underline; }

  .sidebar-item.selected .sidebar-item-desc { display: block; }
  .sidebar-item.selected .sidebar-tools { display: flex; }

  .main {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .panel-header {
    font-family: var(--condensed);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .panel-placeholder {
    font-size: 14px;
    color: var(--text-muted);
  }

  .panel-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: -4px;
    margin-bottom: 16px;
  }

  .panel-loading {
    font-size: 14px;
    color: var(--text-muted);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .panel-empty,
  .panel-error {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .panel-empty code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: var(--surface-hover);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--text-mid);
  }

  .panel-raw-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .panel-raw {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-mid);
    background: var(--surface-hover);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 12px;
    max-height: 400px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .panel.tools-panel { display: none; }
  .panel.tools-panel.empty { display: none; }

  .tools-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tools-link {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-mid);
    text-decoration: none;
  }

  .tools-link:hover { text-decoration: underline; }

  .status-table-wrap {
    overflow-x: auto;
    margin-bottom: 20px;
  }

  .status-table {
    width: 100%;
    border-collapse: collapse;
  }

  .status-table th {
    font-family: var(--condensed);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: left;
    padding: 0 12px 8px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .status-table th.status-col {
    text-align: right;
    width: 1%;
    white-space: nowrap;
  }

  .status-table td {
    font-size: 14px;
    color: var(--text);
    padding: 0 12px;
    height: 36px;
    vertical-align: middle;
  }

  .status-table tbody tr:nth-child(even) td {
    background: var(--surface-hover);
  }

  .status-table td.status-cell {
    text-align: right;
    white-space: nowrap;
  }

  .status-table td.status-cell.status-complete { color: var(--accent-green); }
  .status-table td.status-cell.status-pending { color: var(--text-muted); }

  .next-steps-list {
    list-style: none;
    padding-left: 0;
    margin-bottom: 4px;
  }

  .next-steps-list li {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    padding-left: 18px;
    position: relative;
    margin-bottom: 6px;
  }

  .next-steps-list li::before {
    content: '•';
    position: absolute;
    left: 4px;
    color: var(--text-muted);
  }

  .next-steps-empty {
    margin-bottom: 4px;
  }

  .next-steps-empty code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: var(--surface-hover);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--text-mid);
  }

  .build-progress {
    margin-top: 16px;
    border-top: 1px solid var(--border-subtle);
  }

  .build-progress-header {
    display: flex;
    align-items: center;
    padding: 12px 0;
    cursor: pointer;
    user-select: none;
  }

  .build-progress-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--condensed);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .build-progress-chevron {
    width: 0;
    height: 0;
    border-left: 5px solid var(--text-muted);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform 0.15s;
  }

  .build-progress.expanded .build-progress-chevron {
    transform: rotate(90deg);
  }

  .build-progress-body {
    display: none;
    padding: 4px 0 8px;
  }

  .build-progress.expanded .build-progress-body {
    display: block;
  }

  .backlog-section + .backlog-section {
    border-top: 1px solid var(--border-subtle);
  }

  .backlog-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    cursor: pointer;
    user-select: none;
  }

  .backlog-section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--condensed);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .backlog-chevron {
    width: 0;
    height: 0;
    border-left: 5px solid var(--text-muted);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform 0.15s;
  }

  .backlog-section.expanded .backlog-chevron {
    transform: rotate(90deg);
  }

  .backlog-section-count {
    font-family: var(--condensed);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .backlog-section-body {
    display: none;
    padding: 0 0 12px;
  }

  .backlog-section.expanded .backlog-section-body {
    display: block;
  }

  .backlog-subgroup + .backlog-subgroup {
    margin-top: 12px;
  }

  .backlog-subgroup-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mid);
    margin: 0 0 6px;
    padding-left: 8px;
  }

  .backlog-items {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .backlog-subgroup.titled .backlog-items {
    padding-left: 8px;
  }

  .backlog-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.4;
  }

  .backlog-checkbox {
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    margin-top: 3px;
    border: 1.5px solid var(--text-muted);
    border-radius: 3px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    line-height: 1;
  }

  .backlog-item.done .backlog-checkbox {
    border-color: var(--accent-green);
    background: var(--accent-green);
  }

  .backlog-item.done .backlog-checkbox::before {
    content: '\2713';
    color: #fff;
    font-weight: 700;
  }

  .backlog-item.done .backlog-text {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .backlog-text { flex: 1; }

  .backlog-tag {
    display: inline-block;
    font-family: var(--condensed);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--surface-hover);
    border: 1px solid var(--border-subtle);
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: 1px;
    letter-spacing: 0.02em;
  }

  .sync-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sync-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .sync-machine {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-muted);
  }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mid);
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sync-dot.clean { background: var(--text); }
  .sync-dot.behind { background: var(--text-muted); }
  .sync-dot.dirty { background: #b8b9c2; }
  .sync-dot.absent { background: var(--dot-inactive); }

  .footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: var(--condensed);
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 768px) {
    .page { padding: 24px 16px 60px; }

    .grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .sidebar {
      flex-direction: row;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .sidebar-item {
      flex-shrink: 0;
      padding: 8px 14px;
    }

    .sidebar-item.selected .sidebar-item-desc,
    .sidebar-item.selected .sidebar-tools {
      display: none;
    }

    .panel { padding: 16px; }

    .panel.tools-panel { display: block; }
    .panel.tools-panel.empty { display: none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">
      <h1>Command Center</h1>
      <span class="tag">internal</span>
    </div>
    <button class="refresh-btn" id="refreshBtn">Refresh All</button>
  </div>

  <div class="grid">
    <aside class="sidebar" id="sidebar"></aside>

    <section class="main">
      <div class="panel" id="panelStatus"></div>
      <div class="panel tools-panel" id="panelTools"></div>
      <div class="panel" id="panelSync"></div>
      <div class="panel" id="panelBacklog"></div>
    </section>
  </div>

  <div class="footer">
    <span>Civil Engine LLC</span>
    <span>cven.cc/central</span>
  </div>

</div>

<script>
const PROJECTS = [
  {
    name: 'NextGM',
    repo: 'football-sim',
    desc: 'Football GM simulation',
    branch: 'master',
    tools: [
      { name: 'Avatar Forge', url: '/nextgm/avatar-forge' },
      { name: 'Avatar Forge Guide', url: '/nextgm/avatar-forge-guide' },
    ],
  },
  { name: 'XOI', repo: 'xoi-mobile', desc: 'NFL analytics platform', tools: [] },
  { name: 'StoryEngine', repo: 'storyengine', desc: 'Narrative engine', tools: [] },
  { name: 'XOPlay', repo: 'xoplay-ffl', desc: 'Fantasy football league', tools: [] },
  { name: 'Velocity', repo: 'velocity-002', desc: 'Idea refinement tool', tools: [] },
  { name: 'Elemental Web', repo: 'elemental-web', desc: 'Design tool', tools: [] },
  { name: 'CVEN', repo: 'cven', desc: 'Internal tools & worker', tools: [] },
];

let selectedRepo = PROJECTS[0].repo;
const cache = {};
let syncCache = null;
let currentLoadController = new AbortController();

const MACHINES = [
  { key: 'macbook-pro', label: 'MacBook Pro' },
  { key: 'mac-mini', label: 'Mac Mini' },
];

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === 'class') node.className = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

// ─── Sidebar ─────────────────────────────────────────────────────────

function hasBuildStatusData(repo) {
  const r = cache[repo]?.buildStatus;
  return !!(r && r.content !== undefined);
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = PROJECTS.map(p => {
    const tools = (p.tools || []).map(t => `
      <a class="sidebar-tool" href="${escapeHtml(t.url)}" target="_blank" rel="noopener">${escapeHtml(t.name)}</a>
    `).join('');
    const dotClass = hasBuildStatusData(p.repo) ? 'sidebar-dot active' : 'sidebar-dot';
    return `
      <div class="sidebar-item${p.repo === selectedRepo ? ' selected' : ''}" data-repo="${escapeHtml(p.repo)}">
        <div class="sidebar-item-row">
          <span class="sidebar-item-name">${escapeHtml(p.name)}</span>
          <span class="${dotClass}"></span>
        </div>
        <div class="sidebar-item-desc">${escapeHtml(p.desc)}</div>
        ${tools ? `<div class="sidebar-tools">${tools}</div>` : ''}
      </div>
    `;
  }).join('');
}

function selectProject(repo) {
  if (repo === selectedRepo) return;
  currentLoadController.abort();
  currentLoadController = new AbortController();
  selectedRepo = repo;
  renderSidebar();
  renderSync();
  renderTools();
  loadProject(repo, currentLoadController.signal);
}

document.getElementById('sidebar').addEventListener('click', (e) => {
  const item = e.target.closest('.sidebar-item');
  if (!item) return;
  if (e.target.closest('.sidebar-tool')) return;
  selectProject(item.dataset.repo);
});

// ─── BUILD_STATUS.md parser (§6.2) ───────────────────────────────────

function stripInlineMarkdown(s) {
  return s
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/__([^_]+)__/g, '$1')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1$2')
    .replace(/(^|[^_])_([^_\n]+)_/g, '$1$2')
    .replace(/`([^`]+)`/g, '$1')
    .trim();
}

function parseBuildStatus(content) {
  const updatedMatch = content.match(/last updated[:\s]*(\d{4}-\d{2}-\d{2})/i);
  const lastUpdated = updatedMatch ? updatedMatch[1] : null;

  const lines = content.split('\n');

  // ── Next Steps section ────────────────────────────────────────────
  // null  = heading not found
  // []    = heading found but no bullet items
  // [...] = bullet items
  let nextSteps = null;
  for (let i = 0; i < lines.length; i++) {
    const heading = lines[i].match(/^##\s+(.+?)\s*$/);
    if (!heading) continue;
    if (!/^next steps$/i.test(heading[1].trim())) continue;
    nextSteps = [];
    for (let j = i + 1; j < lines.length; j++) {
      if (/^##\s/.test(lines[j])) break;
      const bullet = lines[j].match(/^\s*[-*]\s+(.+)$/);
      if (bullet) nextSteps.push(stripInlineMarkdown(bullet[1]));
    }
    break;
  }

  // ── Markdown table (headers + rows) ───────────────────────────────
  const tableRows = [];
  let inTable = false;
  for (let i = 0; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    const isRow = trimmed.startsWith('|') && trimmed.endsWith('|');
    if (!inTable && isRow) inTable = true;
    if (inTable) {
      if (isRow) tableRows.push(trimmed);
      else break;
    }
  }

  let table = null;
  if (tableRows.length >= 3) {
    const parseRow = (row) => row.split('|').slice(1, -1).map(c => c.trim());
    const headers = parseRow(tableRows[0]);
    const rows = [];
    for (let r = 2; r < tableRows.length; r++) {
      const cells = parseRow(tableRows[r]);
      if (cells.length) rows.push(cells);
    }
    if (headers.length && rows.length) table = { headers, rows };
  }

  return { lastUpdated, nextSteps, table };
}

// ─── Level A rendering ───────────────────────────────────────────────

function formatUpdatedDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return iso;
  return new Date(y, m - 1, d).toLocaleDateString('en-US', {
    year: 'numeric', month: 'short', day: 'numeric',
  });
}

function statusCellClass(status) {
  const s = status.trim();
  if (s.startsWith('✅')) return 'status-cell status-complete';
  if (s.startsWith('🔲')) return 'status-cell status-pending';
  return 'status-cell';
}

function renderStatusTable(table) {
  const wrap = el('div', { class: 'status-table-wrap' });
  const tbl = el('table', { class: 'status-table' });
  const thead = el('thead');
  const headerRow = el('tr');
  table.headers.forEach((h, idx) => {
    const isLast = idx === table.headers.length - 1 && table.headers.length > 1;
    headerRow.append(el('th', isLast ? { class: 'status-col' } : {}, h));
  });
  thead.append(headerRow);
  tbl.append(thead);

  const tbody = el('tbody');
  for (const cells of table.rows) {
    const tr = el('tr');
    cells.forEach((cell, idx) => {
      const isLast = idx === table.headers.length - 1 && table.headers.length > 1;
      const cls = isLast ? statusCellClass(cell) : null;
      tr.append(el('td', cls ? { class: cls } : {}, cell));
    });
    tbody.append(tr);
  }
  tbl.append(tbody);
  wrap.append(tbl);
  return wrap;
}

function renderBuildProgress(table) {
  const sec = el('div', { class: 'build-progress' });
  const header = el('div', { class: 'build-progress-header' });
  const title = el('div', { class: 'build-progress-title' });
  title.append(el('span', { class: 'build-progress-chevron' }));
  title.append(document.createTextNode('Build Progress'));
  header.append(title);
  sec.append(header);

  const body = el('div', { class: 'build-progress-body' });
  body.append(renderStatusTable(table));
  sec.append(body);

  header.addEventListener('click', () => sec.classList.toggle('expanded'));
  return sec;
}

function renderNextStepsEmpty(message, codeText) {
  const wrap = el('div', { class: 'panel-empty next-steps-empty' });
  const parts = message.split('{code}');
  wrap.append(document.createTextNode(parts[0]));
  wrap.append(el('code', {}, codeText));
  if (parts[1]) wrap.append(document.createTextNode(parts[1]));
  return wrap;
}

function renderLevelA() {
  const panel = document.getElementById('panelStatus');
  panel.innerHTML = '';
  panel.append(el('div', { class: 'panel-header' }, 'Status'));

  const result = cache[selectedRepo]?.buildStatus;

  if (!result) {
    panel.append(el('div', { class: 'panel-loading' }, 'Loading…'));
    return;
  }
  if (result.notFound) {
    panel.append(renderNextStepsEmpty(
      'No BUILD_STATUS.md found. Create one at {code} to surface status here.',
      'docs/status/BUILD_STATUS.md',
    ));
    return;
  }
  if (result.error) {
    panel.append(el('div', { class: 'panel-error' }, 'Failed to load status. Try refreshing.'));
    return;
  }

  let parsed;
  try {
    parsed = parseBuildStatus(result.content);
  } catch (err) {
    panel.append(el('div', { class: 'panel-raw-note' }, 'Could not parse — showing raw content.'));
    panel.append(el('pre', { class: 'panel-raw' }, result.content));
    return;
  }

  if (parsed.lastUpdated) {
    panel.append(el('div', { class: 'panel-meta' }, `Last updated ${formatUpdatedDate(parsed.lastUpdated)}`));
  }

  if (parsed.nextSteps === null) {
    panel.append(renderNextStepsEmpty(
      'No next steps defined. Add a {code} section to BUILD_STATUS.md to surface them here.',
      '## Next Steps',
    ));
  } else if (parsed.nextSteps.length === 0) {
    panel.append(renderNextStepsEmpty(
      'Next steps section is empty — add bullet points below {code} in BUILD_STATUS.md.',
      '## Next Steps',
    ));
  } else {
    const ul = el('ul', { class: 'next-steps-list' });
    for (const item of parsed.nextSteps) ul.append(el('li', {}, item));
    panel.append(ul);
  }

  if (parsed.table) {
    panel.append(renderBuildProgress(parsed.table));
  }
}

// ─── BACKLOG.md parser (§6.3) ────────────────────────────────────────

function parseBacklog(content) {
  const lines = content.split('\n');
  const sections = [];
  let currentSection = null;
  let currentSubgroup = null;

  for (const raw of lines) {
    const line = raw.trim();

    if (line.startsWith('## ')) {
      currentSection = {
        title: line.slice(3).trim(),
        subgroups: [],
        doneCount: 0,
        totalCount: 0,
      };
      sections.push(currentSection);
      currentSubgroup = null;
      continue;
    }

    if (!currentSection) continue;

    if (line.startsWith('### ')) {
      currentSubgroup = { title: line.slice(4).trim(), items: [] };
      currentSection.subgroups.push(currentSubgroup);
      continue;
    }

    const task = line.match(/^-\s+(✅|🔲)\s+(.+)$/);
    if (!task) continue;

    const done = task[1] === '✅';
    const tags = [];
    const text = task[2]
      .replace(/\[([^\]]+)\]/g, (_, t) => { tags.push(t.trim()); return ''; })
      .replace(/\s{2,}/g, ' ')
      .trim();

    if (!currentSubgroup) {
      currentSubgroup = { title: null, items: [] };
      currentSection.subgroups.push(currentSubgroup);
    }
    currentSubgroup.items.push({ done, text, tags });
    currentSection.totalCount++;
    if (done) currentSection.doneCount++;
  }

  return { sections };
}

// ─── Level B rendering ───────────────────────────────────────────────

function renderBacklogItem(item) {
  const row = el('div', { class: 'backlog-item' + (item.done ? ' done' : '') });
  row.append(el('div', { class: 'backlog-checkbox' }));
  const text = el('div', { class: 'backlog-text' });
  text.append(document.createTextNode(item.text));
  for (const tag of item.tags) {
    text.append(el('span', { class: 'backlog-tag' }, tag));
  }
  row.append(text);
  return row;
}

function renderBacklogSection(section, expanded) {
  const sec = el('div', { class: 'backlog-section' + (expanded ? ' expanded' : '') });

  const header = el('div', { class: 'backlog-section-header' });
  const title = el('div', { class: 'backlog-section-title' });
  title.append(el('span', { class: 'backlog-chevron' }));
  title.append(document.createTextNode(section.title));
  header.append(title);
  header.append(el('div', { class: 'backlog-section-count' },
    `${section.doneCount} of ${section.totalCount}`));
  sec.append(header);

  const body = el('div', { class: 'backlog-section-body' });
  for (const sg of section.subgroups) {
    const wrap = el('div', { class: 'backlog-subgroup' + (sg.title ? ' titled' : '') });
    if (sg.title) wrap.append(el('div', { class: 'backlog-subgroup-title' }, sg.title));
    const items = el('div', { class: 'backlog-items' });
    for (const item of sg.items) items.append(renderBacklogItem(item));
    wrap.append(items);
    body.append(wrap);
  }
  sec.append(body);

  header.addEventListener('click', () => sec.classList.toggle('expanded'));
  return sec;
}

function renderLevelB() {
  const panel = document.getElementById('panelBacklog');
  panel.innerHTML = '';
  panel.append(el('div', { class: 'panel-header' }, 'Backlog'));

  const result = cache[selectedRepo]?.backlog;

  if (!result) {
    panel.append(el('div', { class: 'panel-loading' }, 'Loading…'));
    return;
  }
  if (result.notFound) {
    const empty = el('div', { class: 'panel-empty' });
    empty.append(document.createTextNode('No BACKLOG.md found. Create one at '));
    empty.append(el('code', {}, 'docs/status/BACKLOG.md'));
    empty.append(document.createTextNode(' to surface the backlog here.'));
    panel.append(empty);
    return;
  }
  if (result.error) {
    panel.append(el('div', { class: 'panel-error' }, 'Failed to load backlog. Try refreshing.'));
    return;
  }

  let parsed;
  try {
    parsed = parseBacklog(result.content);
  } catch (err) {
    panel.append(el('div', { class: 'panel-raw-note' }, 'Could not parse — showing raw content.'));
    panel.append(el('pre', { class: 'panel-raw' }, result.content));
    return;
  }

  if (parsed.sections.length === 0) {
    panel.append(el('div', { class: 'panel-empty' }, 'Backlog is empty.'));
    return;
  }

  parsed.sections.forEach((section, idx) => {
    panel.append(renderBacklogSection(section, idx === 0));
  });
}

// ─── Tools panel (mobile-only, §7.2) ─────────────────────────────────

function renderTools() {
  const panel = document.getElementById('panelTools');
  panel.innerHTML = '';
  const project = PROJECTS.find(p => p.repo === selectedRepo);
  const tools = project?.tools || [];
  if (tools.length === 0) {
    panel.classList.add('empty');
    return;
  }
  panel.classList.remove('empty');
  panel.append(el('div', { class: 'panel-header' }, 'Tools'));
  const list = el('div', { class: 'tools-list' });
  for (const t of tools) {
    list.append(el('a', {
      class: 'tools-link',
      href: t.url,
      target: '_blank',
      rel: 'noopener',
    }, t.name));
  }
  panel.append(list);
}

// ─── Sync panel (§4.2) ───────────────────────────────────────────────

function getMachineStatus(m) {
  if (!m) return { dotClass: 'absent', label: 'Not cloned' };
  if ((m.dirty || 0) > 0) return { dotClass: 'dirty', label: `${m.dirty} dirty` };
  if ((m.behind || 0) > 0) return { dotClass: 'behind', label: `${m.behind} behind` };
  if (m.status === 'dirty') return { dotClass: 'dirty', label: 'Dirty' };
  if (m.status === 'behind') return { dotClass: 'behind', label: 'Behind' };
  return { dotClass: 'clean', label: 'Clean' };
}

function renderSync() {
  const panel = document.getElementById('panelSync');
  panel.innerHTML = '';
  panel.append(el('div', { class: 'panel-header' }, 'Sync'));

  if (!syncCache) {
    panel.append(el('div', { class: 'panel-loading' }, 'Loading…'));
    return;
  }
  if (syncCache.error) {
    panel.append(el('div', { class: 'panel-error' }, 'Sync status unavailable.'));
    return;
  }

  const repoEntry = (syncCache.repos || []).find(r => r.name === selectedRepo);
  if (!repoEntry) {
    panel.append(el('div', { class: 'panel-empty' }, 'No sync data for this repo'));
    return;
  }

  const rows = el('div', { class: 'sync-rows' });
  for (const { key, label } of MACHINES) {
    const machineData = repoEntry.machines?.[key];
    const { dotClass, label: statusLabel } = getMachineStatus(machineData);
    const row = el('div', { class: 'sync-row' });
    row.append(el('span', { class: 'sync-machine' }, label));
    const status = el('div', { class: 'sync-status' });
    status.append(el('span', { class: `sync-dot ${dotClass}` }));
    status.append(document.createTextNode(statusLabel));
    row.append(status);
    rows.append(row);
  }
  panel.append(rows);
}

// ─── Fetching (§8) ───────────────────────────────────────────────────

async function fetchProjectFile(repo, file, signal) {
  const project = PROJECTS.find(p => p.repo === repo);
  const branch = project?.branch || 'main';
  const url = `/api/project-status?repo=${encodeURIComponent(repo)}&file=${encodeURIComponent(file)}&branch=${encodeURIComponent(branch)}`;
  try {
    const res = await fetch(url, { signal });
    if (res.status === 404) return { notFound: true };
    if (!res.ok) return { error: `HTTP ${res.status}` };
    const data = await res.json();
    if (!data.ok) return { error: data.error || 'Unknown error' };
    return { content: data.content, fetchedAt: data.fetchedAt };
  } catch (err) {
    if (err.name === 'AbortError' || signal?.aborted) return { aborted: true };
    return { error: err.message };
  }
}

function fetchBuildStatus(repo, signal) {
  return fetchProjectFile(repo, 'docs/status/BUILD_STATUS.md', signal);
}

function fetchBacklog(repo, signal) {
  return fetchProjectFile(repo, 'docs/status/BACKLOG.md', signal);
}

async function fetchSyncStatus() {
  try {
    const res = await fetch('/api/sync-status');
    if (!res.ok) return { error: `HTTP ${res.status}` };
    return await res.json();
  } catch (err) {
    return { error: err.message };
  }
}

function storeBuildStatus(repo, result) {
  cache[repo] = cache[repo] || {};
  cache[repo].buildStatus = result;
}

function storeBacklog(repo, result) {
  cache[repo] = cache[repo] || {};
  cache[repo].backlog = result;
}

async function loadProject(repo, signal) {
  if (repo === selectedRepo) {
    renderLevelA();
    renderLevelB();
  }

  const tasks = [];
  if (!cache[repo]?.buildStatus) {
    tasks.push(fetchBuildStatus(repo, signal).then(r => {
      if (r.aborted) return;
      storeBuildStatus(repo, r);
      renderSidebar();
      if (repo === selectedRepo) renderLevelA();
    }));
  }
  if (!cache[repo]?.backlog) {
    tasks.push(fetchBacklog(repo, signal).then(r => {
      if (r.aborted) return;
      storeBacklog(repo, r);
      if (repo === selectedRepo) renderLevelB();
    }));
  }
  await Promise.all(tasks);
}

async function refreshAll() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  currentLoadController.abort();
  currentLoadController = new AbortController();
  const signal = currentLoadController.signal;
  try {
    for (const p of PROJECTS) {
      if (cache[p.repo]) {
        delete cache[p.repo].buildStatus;
        if (p.repo === selectedRepo) delete cache[p.repo].backlog;
      }
    }
    syncCache = null;
    renderLevelA();
    renderLevelB();
    renderSync();

    const tasks = PROJECTS.map(async (p) => {
      const r = await fetchBuildStatus(p.repo, signal);
      if (r.aborted) return;
      storeBuildStatus(p.repo, r);
    });
    tasks.push(fetchBacklog(selectedRepo, signal).then(r => {
      if (r.aborted) return;
      storeBacklog(selectedRepo, r);
    }));
    tasks.push(fetchSyncStatus().then(r => { syncCache = r; }));
    await Promise.all(tasks);

    if (signal.aborted) return;
    renderSidebar();
    renderLevelA();
    renderLevelB();
    renderSync();
  } finally {
    btn.classList.remove('spinning');
  }
}

document.getElementById('refreshBtn').addEventListener('click', refreshAll);

// ─── Init ────────────────────────────────────────────────────────────

renderSidebar();
renderLevelA();
renderLevelB();
renderSync();
renderTools();
loadProject(selectedRepo, currentLoadController.signal);
fetchSyncStatus().then(r => { syncCache = r; renderSync(); });
</script>
