<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — CVEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-hover: #f6f8fa;
    --border: #dde1e8;
    --border-subtle: #e8ecf0;
    --text: #1a1b22;
    --text-mid: #4a4b58;
    --text-muted: #8a8b98;
    --accent-green: #4caf50;
    --accent-yellow: #f5a623;
    --dot-inactive: #ccd0d8;
    --radius: 12px;
    --radius-sm: 8px;
    --sans: 'Barlow', system-ui, sans-serif;
    --condensed: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    padding: 32px 24px 80px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .brand h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .brand .tag {
    font-family: var(--condensed);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    background: rgba(0, 0, 0, 0.04);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .topbar-sync {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .topbar-sync-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mid);
  }

  .refresh-btn {
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-mid);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .refresh-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .refresh-btn.spinning {
    opacity: 0.55;
    pointer-events: none;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  .grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
    align-items: flex-start;
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sidebar-item {
    display: block;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
  }

  .sidebar-item.selected {
    background: var(--surface);
    border-color: var(--border);
  }

  .sidebar-item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .sidebar-item-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .sidebar-item.selected .sidebar-item-name {
    font-weight: 600;
  }

  .sidebar-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-inactive);
    flex-shrink: 0;
  }

  .sidebar-dot.active { background: var(--accent-green); }

  .sidebar-item-desc {
    display: none;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .sidebar-tools {
    display: none;
    flex-direction: column;
    gap: 4px;
    margin-top: 8px;
    margin-left: 16px;
  }

  .sidebar-tool {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-mid);
    text-decoration: none;
  }

  .sidebar-tool:hover { text-decoration: underline; }

  .sidebar-item.selected .sidebar-item-desc { display: block; }
  .sidebar-item.selected .sidebar-tools { display: flex; }

  .main {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .panel-header {
    font-family: var(--condensed);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .panel-placeholder {
    font-size: 14px;
    color: var(--text-muted);
  }

  .panel-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: -4px;
    margin-bottom: 16px;
  }

  .panel-loading {
    font-size: 14px;
    color: var(--text-muted);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .panel-empty,
  .panel-error {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .panel-empty code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: var(--surface-hover);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--text-mid);
  }

  .panel-raw-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .panel-raw {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-mid);
    background: var(--surface-hover);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 12px;
    max-height: 400px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .panel.tools-panel { display: none; }
  .panel.tools-panel.empty { display: none; }

  .tools-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tools-link {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-mid);
    text-decoration: none;
  }

  .tools-link:hover { text-decoration: underline; }

  .status-table-wrap {
    overflow-x: auto;
    margin-bottom: 20px;
  }

  .status-table {
    width: 100%;
    border-collapse: collapse;
  }

  .status-table th {
    font-family: var(--condensed);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: left;
    padding: 0 12px 8px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .status-table th.status-col {
    text-align: right;
    width: 1%;
    white-space: nowrap;
  }

  .status-table td {
    font-size: 14px;
    color: var(--text);
    padding: 0 12px;
    height: 36px;
    vertical-align: middle;
  }

  .status-table tbody tr:nth-child(even) td {
    background: var(--surface-hover);
  }

  .status-table td.status-cell {
    text-align: right;
    white-space: nowrap;
  }

  .status-table td.status-cell.status-complete { color: var(--accent-green); }
  .status-table td.status-cell.status-pending { color: var(--text-muted); }

  .next-steps-list {
    list-style: none;
    padding-left: 0;
    margin-bottom: 4px;
  }

  .next-steps-list li {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    padding-left: 18px;
    position: relative;
    margin-bottom: 6px;
  }

  .next-steps-list li::before {
    content: '•';
    position: absolute;
    left: 4px;
    color: var(--text-muted);
  }

  .next-steps-empty {
    margin-bottom: 4px;
  }

  .next-steps-empty code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: var(--surface-hover);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--text-mid);
  }

  .build-progress {
    margin-top: 16px;
    border-top: 1px solid var(--border-subtle);
  }

  .build-progress-header {
    display: flex;
    align-items: center;
    padding: 12px 0;
    cursor: pointer;
    user-select: none;
  }

  .build-progress-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--condensed);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .build-progress-chevron {
    width: 0;
    height: 0;
    border-left: 5px solid var(--text-muted);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform 0.15s;
  }

  .build-progress.expanded .build-progress-chevron {
    transform: rotate(90deg);
  }

  .build-progress-body {
    display: none;
    padding: 4px 0 8px;
  }

  .build-progress.expanded .build-progress-body {
    display: block;
  }

  .backlog-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .backlog-tabs {
    display: flex;
    gap: 6px;
  }

  .backlog-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .backlog-add-btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-mid);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .backlog-add-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .backlog-save-btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border: 1px solid var(--accent-green);
    background: var(--accent-green);
    color: #fff;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }

  .backlog-save-btn:hover:not(.saving):not(.saved) {
    opacity: 0.88;
  }

  .backlog-save-btn.hidden {
    display: none;
  }

  .backlog-save-btn.saving {
    opacity: 0.7;
    pointer-events: none;
  }

  .backlog-save-btn.saved {
    background: var(--text);
    border-color: var(--text);
    pointer-events: none;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 25, 0.42);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 480px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    box-shadow: 0 18px 48px -12px rgba(15, 18, 25, 0.25);
  }

  .modal-title {
    font-family: var(--condensed);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .modal-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .modal-label {
    font-family: var(--condensed);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .modal-select,
  .modal-input,
  .modal-textarea {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    width: 100%;
  }

  .modal-textarea {
    resize: vertical;
    min-height: 80px;
    font-family: var(--sans);
    line-height: 1.4;
  }

  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .modal-tag {
    font-family: var(--condensed);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-mid);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }

  .modal-tag:hover {
    border-color: var(--text-muted);
  }

  .modal-tag.selected {
    color: #fff;
    border-color: transparent;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .modal-btn {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-mid);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .modal-btn:hover:not(:disabled) {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .modal-btn.primary {
    background: var(--text);
    border-color: var(--text);
    color: var(--surface);
  }

  .modal-btn.primary:hover:not(:disabled) {
    border-color: var(--text);
    color: var(--surface);
    opacity: 0.88;
  }

  .modal-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .modal-error {
    font-size: 13px;
    color: #e74c3c;
    line-height: 1.4;
  }

  .backlog-tab {
    font-family: var(--condensed);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }

  .backlog-tab:hover {
    color: var(--text-mid);
  }

  .backlog-tab.active {
    color: var(--text);
    background: var(--bg);
    border-color: var(--border-subtle);
  }

  .backlog-section + .backlog-section {
    border-top: 1px solid var(--border-subtle);
  }

  .backlog-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    cursor: pointer;
    user-select: none;
  }

  .backlog-section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--condensed);
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .backlog-chevron {
    width: 0;
    height: 0;
    border-left: 5px solid var(--text-muted);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform 0.15s;
  }

  .backlog-section.expanded .backlog-chevron {
    transform: rotate(90deg);
  }

  .backlog-section-count {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .backlog-section-body {
    display: none;
    padding: 0 0 12px;
  }

  .backlog-section.expanded .backlog-section-body {
    display: block;
  }

  .backlog-flat {
    padding: 4px 0 8px;
  }

  .backlog-items {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .backlog-subheading {
    font-family: var(--condensed);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 10px;
    margin-bottom: 2px;
  }

  .backlog-items > .backlog-subheading:first-child {
    margin-top: 0;
  }

  .backlog-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.4;
    cursor: pointer;
    margin: 0;
  }

  .backlog-checkbox {
    flex-shrink: 0;
    margin: 2px 0 0;
    cursor: pointer;
  }

  .backlog-item.done .backlog-text {
    color: #95a5a6;
    text-decoration: line-through;
  }

  .backlog-text { flex: 1; }

  .backlog-tag {
    display: inline-block;
    font-family: var(--condensed);
    font-size: 11px;
    font-weight: 500;
    color: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: 1px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sync-dot.clean { background: var(--text); }
  .sync-dot.behind { background: var(--text-muted); }
  .sync-dot.dirty { background: #b8b9c2; }
  .sync-dot.absent { background: var(--dot-inactive); }

  .footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: var(--condensed);
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 768px) {
    .page { padding: 24px 16px 60px; }

    .topbar-right { gap: 10px; }
    .topbar-sync { display: none; }

    .grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .sidebar {
      flex-direction: row;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .sidebar-item {
      flex-shrink: 0;
      padding: 8px 14px;
    }

    .sidebar-item.selected .sidebar-item-desc,
    .sidebar-item.selected .sidebar-tools {
      display: none;
    }

    .panel { padding: 16px; }

    .panel.tools-panel { display: block; }
    .panel.tools-panel.empty { display: none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">
      <h1>Command Center</h1>
      <span class="tag">internal</span>
    </div>
    <div class="topbar-right">
      <div class="topbar-sync" id="topbarSync"></div>
      <button class="refresh-btn" id="refreshBtn">Refresh All</button>
    </div>
  </div>

  <div class="grid">
    <aside class="sidebar" id="sidebar"></aside>

    <section class="main">
      <div class="panel" id="panelStatus"></div>
      <div class="panel tools-panel" id="panelTools"></div>
      <div class="panel" id="panelBacklog"></div>
    </section>
  </div>

  <div class="footer">
    <span>Civil Engine LLC</span>
    <span>cven.cc/central</span>
  </div>

</div>

<script>
const PROJECTS = [
  {
    name: 'NextGM',
    repo: 'football-sim',
    desc: 'Football GM simulation',
    branch: 'master',
    tools: [
      { name: 'Avatar Forge', url: '/nextgm/avatar-forge' },
      { name: 'Avatar Forge Guide', url: '/nextgm/avatar-forge-guide' },
    ],
  },
  { name: 'XOI', repo: 'xoi-mobile', desc: 'NFL analytics platform', tools: [] },
  { name: 'StoryEngine', repo: 'storyengine', desc: 'Narrative engine', tools: [] },
  { name: 'XOPlay', repo: 'xoplay-ffl', desc: 'Fantasy football league', tools: [] },
  { name: 'Velocity', repo: 'velocity-002', desc: 'Idea refinement tool', tools: [] },
  { name: 'Elemental Web', repo: 'elemental-web', desc: 'Design tool', tools: [] },
  { name: 'CVEN', repo: 'cven', desc: 'Internal tools & worker', tools: [] },
];

let selectedRepo = PROJECTS[0].repo;
const cache = {};
let syncCache = null;
let backlogTab = 'outstanding';
const pendingChanges = {}; // repo → Map<lineIndex, newDoneState>
let currentLoadController = new AbortController();

function getPendingMap(repo) {
  if (!pendingChanges[repo]) pendingChanges[repo] = new Map();
  return pendingChanges[repo];
}

function pendingCount(repo) {
  return pendingChanges[repo]?.size || 0;
}

function clearPending(repo) {
  pendingChanges[repo] = new Map();
}

function confirmDiscardPending(actionLabel) {
  const count = pendingCount(selectedRepo);
  if (count === 0) return true;
  const ok = confirm(
    `You have ${count} unsaved checkbox change${count > 1 ? 's' : ''}. Discard and ${actionLabel}?`
  );
  if (ok) clearPending(selectedRepo);
  return ok;
}

const MACHINES = [
  { key: 'macbook-pro', label: 'MacBook Pro' },
  { key: 'mac-mini', label: 'Mac Mini' },
];

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === 'class') node.className = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

// ─── BUILD_STATUS.md parser (§6.2) ───────────────────────────────────

function stripInlineMarkdown(s) {
  return s
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/__([^_]+)__/g, '$1')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1$2')
    .replace(/(^|[^_])_([^_\n]+)_/g, '$1$2')
    .replace(/`([^`]+)`/g, '$1')
    .trim();
}

function parseBuildStatus(content) {
  const updatedMatch = content.match(/last updated[:\s]*(\d{4}-\d{2}-\d{2})/i);
  const lastUpdated = updatedMatch ? updatedMatch[1] : null;

  const lines = content.split('\n');

  // ── Next Steps section ────────────────────────────────────────────
  // null  = heading not found
  // []    = heading found but no bullet items
  // [...] = bullet items
  let nextSteps = null;
  for (let i = 0; i < lines.length; i++) {
    const heading = lines[i].match(/^##\s+(.+?)\s*$/);
    if (!heading) continue;
    if (!/^next steps$/i.test(heading[1].trim())) continue;
    nextSteps = [];
    for (let j = i + 1; j < lines.length; j++) {
      if (/^##\s/.test(lines[j])) break;
      const bullet = lines[j].match(/^\s*[-*]\s+(.+)$/);
      if (bullet) nextSteps.push(stripInlineMarkdown(bullet[1]));
    }
    break;
  }

  // ── Markdown table (headers + rows) ───────────────────────────────
  const tableRows = [];
  let inTable = false;
  for (let i = 0; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    const isRow = trimmed.startsWith('|') && trimmed.endsWith('|');
    if (!inTable && isRow) inTable = true;
    if (inTable) {
      if (isRow) tableRows.push(trimmed);
      else break;
    }
  }

  let table = null;
  if (tableRows.length >= 3) {
    const parseRow = (row) => row.split('|').slice(1, -1).map(c => c.trim());
    const headers = parseRow(tableRows[0]);
    const rows = [];
    for (let r = 2; r < tableRows.length; r++) {
      const cells = parseRow(tableRows[r]);
      if (cells.length) rows.push(cells);
    }
    if (headers.length && rows.length) table = { headers, rows };
  }

  return { lastUpdated, nextSteps, table };
}

// ─── Level A rendering ───────────────────────────────────────────────

function formatUpdatedDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return iso;
  return new Date(y, m - 1, d).toLocaleDateString('en-US', {
    year: 'numeric', month: 'short', day: 'numeric',
  });
}

function statusCellClass(status) {
  const s = status.trim();
  if (s.startsWith('✅')) return 'status-cell status-complete';
  if (s.startsWith('🔲')) return 'status-cell status-pending';
  return 'status-cell';
}

function renderStatusTable(table) {
  const wrap = el('div', { class: 'status-table-wrap' });
  const tbl = el('table', { class: 'status-table' });
  const thead = el('thead');
  const headerRow = el('tr');
  table.headers.forEach((h, idx) => {
    const isLast = idx === table.headers.length - 1 && table.headers.length > 1;
    headerRow.append(el('th', isLast ? { class: 'status-col' } : {}, h));
  });
  thead.append(headerRow);
  tbl.append(thead);

  const tbody = el('tbody');
  for (const cells of table.rows) {
    const tr = el('tr');
    cells.forEach((cell, idx) => {
      const isLast = idx === table.headers.length - 1 && table.headers.length > 1;
      const cls = isLast ? statusCellClass(cell) : null;
      tr.append(el('td', cls ? { class: cls } : {}, cell));
    });
    tbody.append(tr);
  }
  tbl.append(tbody);
  wrap.append(tbl);
  return wrap;
}

function renderBuildProgress(table) {
  const sec = el('div', { class: 'build-progress' });
  const header = el('div', { class: 'build-progress-header' });
  const title = el('div', { class: 'build-progress-title' });
  title.append(el('span', { class: 'build-progress-chevron' }));
  title.append(document.createTextNode('Build Progress'));
  header.append(title);
  sec.append(header);

  const body = el('div', { class: 'build-progress-body' });
  body.append(renderStatusTable(table));
  sec.append(body);

  header.addEventListener('click', () => sec.classList.toggle('expanded'));
  return sec;
}

function renderNextStepsEmpty(message, codeText) {
  const wrap = el('div', { class: 'panel-empty next-steps-empty' });
  const parts = message.split('{code}');
  wrap.append(document.createTextNode(parts[0]));
  wrap.append(el('code', {}, codeText));
  if (parts[1]) wrap.append(document.createTextNode(parts[1]));
  return wrap;
}

function renderLevelA() {
  const panel = document.getElementById('panelStatus');
  panel.innerHTML = '';
  panel.append(el('div', { class: 'panel-header' }, 'Next Steps'));

  const result = cache[selectedRepo]?.buildStatus;

  if (!result) {
    panel.append(el('div', { class: 'panel-loading' }, 'Loading…'));
    return;
  }
  if (result.notFound) {
    panel.append(renderNextStepsEmpty(
      'No BUILD_STATUS.md found. Create one at {code} to surface status here.',
      'docs/status/BUILD_STATUS.md',
    ));
    return;
  }
  if (result.error) {
    panel.append(el('div', { class: 'panel-error' }, 'Failed to load status. Try refreshing.'));
    return;
  }

  let parsed;
  try {
    parsed = parseBuildStatus(result.content);
  } catch (err) {
    panel.append(el('div', { class: 'panel-raw-note' }, 'Could not parse — showing raw content.'));
    panel.append(el('pre', { class: 'panel-raw' }, result.content));

  }

  if (parsed.lastUpdated) {

  }

      '## Next Steps',
    ));
  } else {
    const ul = el('ul', { class: 'next-steps-list' });
    for (const item of parsed.nextSteps) ul.append(el('li', {}, item));
    panel.append(ul);
  }

  if (parsed.table) {
    panel.append(renderBuildProgress(parsed.table));
  }
}

// ─── BACKLOG.md parser (§6.3) ────────────────────────────────────────

function parseBacklogItem(line) {
  let done;
  let text;
  const checkbox = line.match(/^\s*-\s+\[([ xX])\]\s+(.+?)\s*$/);
  if (checkbox) {
    done = checkbox[1].toLowerCase() === 'x';
    text = checkbox[2];
  } else {
    const emoji = line.match(/^\s*-\s+(✅|🔲)\s+(.+?)\s*$/);
    if (!emoji) return null;
    done = emoji[1] === '✅';
    text = emoji[2];
  }

  const tags = [];
  while (true) {
    const tagMatch = text.match(/^(.+?)\s*\[([^\]]+)\]\s*$/);
    if (!tagMatch) break;
    tags.unshift(tagMatch[2].trim());
    text = tagMatch[1];
  }
  return { done, text: text.trim(), tags };
}

function parseBacklog(content) {
  const lines = content.split('\n');
  const sections = [];
  const orphanItems = [];
  let currentSection = null;
  let sawSectionHeading = false;

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const sectionMatch = raw.match(/^##(?!#)\s+(.+?)\s*$/);
    if (sectionMatch) {
      sawSectionHeading = true;
      currentSection = {
        title: sectionMatch[1].trim(),
        items: [],
        doneCount: 0,
        totalCount: 0,
      };
      sections.push(currentSection);
      continue;
    }

    const subHeadingMatch = raw.match(/^###\s+(.+?)\s*$/);
    if (subHeadingMatch) {
      if (currentSection) {
        currentSection.items.push({ subheading: true, title: subHeadingMatch[1].trim() });
      }
      continue;
    }

    const item = parseBacklogItem(raw);
    if (!item) continue;
    item.lineIndex = i;

    if (currentSection) {
      currentSection.items.push(item);
      currentSection.totalCount++;
      if (item.done) currentSection.doneCount++;
    } else {
      orphanItems.push(item);
    }
  }

  // No `## ` headings anywhere → flat list (spec §5)
  if (!sawSectionHeading && orphanItems.length) {
    return {
      sections: [],
      flat: {
        items: orphanItems,
        doneCount: orphanItems.filter(i => i.done).length,
        totalCount: orphanItems.length,
      },
    };
  }

  return { sections, flat: null };
}

// ─── Level B rendering ───────────────────────────────────────────────

const BACKLOG_TAG_COLORS = {
  p0: '#e74c3c',
  p1: '#e67e22',
  p2: '#3498db',
  p3: '#95a5a6',
  ui: '#1abc9c',
  api: '#9b59b6',
  data: '#34495e',
  bug: '#e74c3c',
  engine: '#27ae60',
  figma: '#e84393',
  carry: '#f39c12',
};
const BACKLOG_TAG_DEFAULT = '#bdc3c7';

function renderBacklogTag(tag) {
  const color = BACKLOG_TAG_COLORS[tag.toLowerCase()] || BACKLOG_TAG_DEFAULT;
  return el('span', { class: 'backlog-tag', style: `background-color:${color}` }, tag);
}

function renderBacklogItem(item) {
  const repo = selectedRepo;
  const pending = pendingChanges[repo];
  const displayedDone = pending?.has(item.lineIndex)
    ? pending.get(item.lineIndex)
    : item.done;

  const row = el('label', { class: 'backlog-item' + (displayedDone ? ' done' : '') });
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.className = 'backlog-checkbox';
  input.checked = displayedDone;
  input.addEventListener('change', () => {
    const newDone = input.checked;
    row.classList.toggle('done', newDone);
    if (item.lineIndex == null) return; // can't track changes without a line index
    const map = getPendingMap(repo);
    if (newDone === item.done) {
      map.delete(item.lineIndex);
    } else {
      map.set(item.lineIndex, newDone);
    }
    updateSaveButton();
  });
  row.append(input);
  const text = el('div', { class: 'backlog-text' });
  text.append(document.createTextNode(item.text));
  for (const tag of item.tags) text.append(renderBacklogTag(tag));
  row.append(text);
  return row;
}

function renderBacklogSection(section) {
  const sec = el('div', { class: 'backlog-section expanded' });

  const header = el('div', { class: 'backlog-section-header' });
  const title = el('div', { class: 'backlog-section-title' });
  title.append(el('span', { class: 'backlog-chevron' }));
  title.append(document.createTextNode(section.title));
  header.append(title);
  header.append(el('div', { class: 'backlog-section-count' },
    `${section.doneCount} / ${section.totalCount}`));
  sec.append(header);

  const body = el('div', { class: 'backlog-section-body' });
  const items = el('div', { class: 'backlog-items' });
  for (const item of section.items) {
    if (item.subheading) {
      items.append(el('div', { class: 'backlog-subheading' }, item.title));
    } else {
      items.append(renderBacklogItem(item));
    }
  }
  body.append(items);
  sec.append(body);

  header.addEventListener('click', () => sec.classList.toggle('expanded'));
  return sec;
}

function renderBacklogFlat(flat) {
  const wrap = el('div', { class: 'backlog-flat' });
  const items = el('div', { class: 'backlog-items' });
  for (const item of flat.items) items.append(renderBacklogItem(item));
  wrap.append(items);
  return wrap;
}

function collectBacklogItems(parsed) {
  const all = [];
  if (parsed.flat) {
    for (const it of parsed.flat.items) all.push(it);
  } else {
    for (const section of parsed.sections) {
      for (const it of section.items) {
        if (!it.subheading) all.push(it);
      }
    }
  }
  return all;
}

function renderBacklogTabs(totalOutstanding, totalAll) {
  const tabs = el('div', { class: 'backlog-tabs' });
  const mkTab = (key, label) => {
    const btn = el('button',
      { class: 'backlog-tab' + (backlogTab === key ? ' active' : ''), type: 'button' },
      label);
    btn.addEventListener('click', () => {
      if (backlogTab === key) return;
      backlogTab = key;
      renderLevelB();
    });
    return btn;
  };
  tabs.append(mkTab('outstanding', `Outstanding (${totalOutstanding})`));
  tabs.append(mkTab('all', `All (${totalAll})`));
  return tabs;
}

function renderBacklogOutstanding(items) {
  if (items.length === 0) {
    return el('div', { class: 'panel-empty' }, 'Nothing outstanding — everything is checked.');
  }
  const wrap = el('div', { class: 'backlog-flat' });
  const list = el('div', { class: 'backlog-items' });
  for (const item of items) list.append(renderBacklogItem(item));
  wrap.append(list);
  return wrap;
}

function renderLevelB() {
  const panel = document.getElementById('panelBacklog');
  panel.innerHTML = '';
  panel.append(el('div', { class: 'panel-header' }, 'Backlog'));

  const result = cache[selectedRepo]?.backlog;

  if (!result) {
    panel.append(el('div', { class: 'panel-loading' }, 'Loading…'));
    return;
  }
  if (result.notFound) {
    const empty = el('div', { class: 'panel-empty' });
    empty.append(document.createTextNode('No BACKLOG.md found. Create one at '));
    empty.append(el('code', {}, 'docs/status/BACKLOG.md'));
    empty.append(document.createTextNode(' to surface the backlog here.'));
    panel.append(empty);
    return;
  }
  if (result.error) {
    panel.append(el('div', { class: 'panel-error' }, `Error loading BACKLOG.md: ${result.error}`));
    return;
  }

  let parsed;
  try {
    parsed = parseBacklog(result.content);
  } catch (err) {
    panel.append(el('div', { class: 'panel-raw-note' }, 'Could not parse — showing raw content.'));
    panel.append(el('pre', { class: 'panel-raw' }, result.content));
    return;
  }

  const allItems = collectBacklogItems(parsed);
  const outstanding = allItems.filter(i => !i.done);

  const headerRow = el('div', { class: 'backlog-header-row' });
  if (allItems.length > 0) {
    headerRow.append(renderBacklogTabs(outstanding.length, allItems.length));
  } else {
    headerRow.append(el('div'));
  }
  const actions = el('div', { class: 'backlog-actions' });
  const saveBtn = el('button',
    { class: 'backlog-save-btn', type: 'button', id: 'backlogSaveBtn' },
    'Save');
  saveBtn.addEventListener('click', saveBacklogChanges);
  actions.append(saveBtn);
  const addBtn = el('button', { class: 'backlog-add-btn', type: 'button' }, '+ Add Item');
  addBtn.addEventListener('click', () => openAddItemModal(parsed));
  actions.append(addBtn);
  headerRow.append(actions);
  panel.append(headerRow);
  updateSaveButton();

  if (allItems.length === 0) {
    panel.append(el('div', { class: 'panel-empty' }, 'Backlog is empty.'));
    return;
  }

  if (backlogTab === 'outstanding') {
    panel.append(renderBacklogOutstanding(outstanding));
    return;
  }

  // 'all' tab — existing collapsible-sections view (unchanged)
  if (parsed.flat) {
    panel.append(renderBacklogFlat(parsed.flat));
    return;
  }

  for (const section of parsed.sections) {
    panel.append(renderBacklogSection(section));
  }
}

// ─── Save (checkbox state) ───────────────────────────────────────────

function updateSaveButton() {
  const btn = document.getElementById('backlogSaveBtn');
  if (!btn) return;
  if (btn.classList.contains('saving') || btn.classList.contains('saved')) return;
  const count = pendingCount(selectedRepo);
  if (count === 0) {
    btn.classList.add('hidden');
    btn.textContent = 'Save';
  } else {
    btn.classList.remove('hidden');
    btn.textContent = `Save (${count})`;
  }
}

function applyPendingToContent(rawContent, pendingMap) {
  const eol = rawContent.includes('\r\n') ? '\r\n' : '\n';
  const lines = rawContent.split(/\r?\n/);
  for (const [lineIndex, newDone] of pendingMap) {
    const line = lines[lineIndex];
    if (line == null) continue;
    if (newDone) {
      lines[lineIndex] = line
        .replace(/^(\s*-\s+)🔲(\s)/, '$1✅$2')
        .replace(/^(\s*-\s+)\[ \](\s)/, '$1[x]$2');
    } else {
      lines[lineIndex] = line
        .replace(/^(\s*-\s+)✅(\s)/, '$1🔲$2')
        .replace(/^(\s*-\s+)\[[xX]\](\s)/, '$1[ ]$2');
    }
  }
  return lines.join(eol);
}

async function saveBacklogChanges() {
  const repo = selectedRepo;
  const map = pendingChanges[repo];
  if (!map || map.size === 0) return;
  const result = cache[repo]?.backlog;
  if (!result?.content) return;
  const project = PROJECTS.find(p => p.repo === repo);
  if (!project) return;

  const updated = applyPendingToContent(result.content, map);
  if (updated === result.content) {
    // Nothing actually changed in the text — clear and bail.
    clearPending(repo);
    updateSaveButton();
    return;
  }

  const btn = document.getElementById('backlogSaveBtn');
  if (btn) {
    btn.classList.add('saving');
    btn.classList.remove('saved');
    btn.textContent = 'Saving…';
  }

  try {
    const res = await fetch('/api/project-file', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        repo,
        file: 'docs/status/BACKLOG.md',
        branch: project.branch || 'main',
        content: updated,
        commitMessage: 'backlog: update checkbox states',
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      if (btn) {
        btn.classList.remove('saving');
        btn.textContent = `Save (${map.size})`;
      }
      alert(`Save failed: ${data.error || res.status}`);
      return;
    }

    clearPending(repo);

    if (btn) {
      btn.classList.remove('saving');
      btn.classList.add('saved');
      btn.textContent = 'Saved';
    }

    // Re-fetch so future toggles map to fresh line indices.
    delete cache[repo].backlog;
    const refreshed = await fetchBacklog(repo);
    if (refreshed.aborted) return;
    storeBacklog(repo, refreshed);
    if (repo === selectedRepo) {
      setTimeout(() => renderLevelB(), 700);
    }
  } catch (err) {
    if (btn) {
      btn.classList.remove('saving');
      btn.textContent = `Save (${map.size})`;
    }
    alert(`Save error: ${err.message}`);
  }
}

// ─── Add Item modal ──────────────────────────────────────────────────

const COMMON_TAGS = ['bug', 'figma', 'engine', 'carry'];

function openAddItemModal(parsed) {
  const project = PROJECTS.find(p => p.repo === selectedRepo);
  if (!project) return;
  if (!confirmDiscardPending('add a new item')) return;

  const sections = parsed?.sections || [];
  const selectedTags = new Set();

  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal' });

  modal.append(el('div', { class: 'modal-title' }, `Add Item — ${project.name}`));

  // SECTION
  const sectionField = el('div', { class: 'modal-field' });
  sectionField.append(el('label', { class: 'modal-label' }, 'Section'));
  const sectionSelect = document.createElement('select');
  sectionSelect.className = 'modal-select';
  for (const s of sections) {
    const opt = document.createElement('option');
    opt.value = s.title;
    opt.textContent = s.title;
    sectionSelect.append(opt);
  }
  const newSecOpt = document.createElement('option');
  newSecOpt.value = '__new__';
  newSecOpt.textContent = '+ New section…';
  sectionSelect.append(newSecOpt);
  if (sections.length === 0) sectionSelect.value = '__new__';
  sectionField.append(sectionSelect);
  const sectionInput = document.createElement('input');
  sectionInput.className = 'modal-input';
  sectionInput.type = 'text';
  sectionInput.placeholder = 'New section name';
  sectionInput.style.display = sections.length === 0 ? '' : 'none';
  sectionField.append(sectionInput);
  modal.append(sectionField);

  // SUBSECTION
  const subField = el('div', { class: 'modal-field' });
  subField.append(el('label', { class: 'modal-label' }, 'Subsection (optional)'));
  const subSelect = document.createElement('select');
  subSelect.className = 'modal-select';
  subField.append(subSelect);
  const subInput = document.createElement('input');
  subInput.className = 'modal-input';
  subInput.type = 'text';
  subInput.placeholder = 'New subsection name';
  subInput.style.display = 'none';
  subField.append(subInput);
  modal.append(subField);

  function refreshSubsections() {
    subSelect.innerHTML = '';
    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = '(none)';
    subSelect.append(noneOpt);
    if (sectionSelect.value !== '__new__') {
      const section = sections.find(s => s.title === sectionSelect.value);
      if (section) {
        for (const item of section.items) {
          if (item.subheading) {
            const opt = document.createElement('option');
            opt.value = item.title;
            opt.textContent = item.title;
            subSelect.append(opt);
          }
        }
      }
    }
    const newSubOpt = document.createElement('option');
    newSubOpt.value = '__new__';
    newSubOpt.textContent = '+ New subsection…';
    subSelect.append(newSubOpt);
    subInput.style.display = 'none';
  }
  refreshSubsections();

  sectionSelect.addEventListener('change', () => {
    sectionInput.style.display = sectionSelect.value === '__new__' ? '' : 'none';
    refreshSubsections();
  });
  subSelect.addEventListener('change', () => {
    subInput.style.display = subSelect.value === '__new__' ? '' : 'none';
  });

  // ITEM DESCRIPTION
  const descField = el('div', { class: 'modal-field' });
  descField.append(el('label', { class: 'modal-label' }, 'Item Description'));
  const descTextarea = document.createElement('textarea');
  descTextarea.className = 'modal-textarea';
  descTextarea.placeholder = 'What needs to happen?';
  descField.append(descTextarea);
  modal.append(descField);

  // TAGS
  const tagField = el('div', { class: 'modal-field' });
  tagField.append(el('label', { class: 'modal-label' }, 'Tags'));
  const tagRow = el('div', { class: 'modal-tags' });
  for (const tag of COMMON_TAGS) {
    const btn = el('button', { class: 'modal-tag', type: 'button' }, tag);
    btn.addEventListener('click', () => {
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
        btn.classList.remove('selected');
        btn.style.backgroundColor = '';
      } else {
        selectedTags.add(tag);
        btn.classList.add('selected');
        btn.style.backgroundColor = BACKLOG_TAG_COLORS[tag] || BACKLOG_TAG_DEFAULT;
      }
    });
    tagRow.append(btn);
  }
  tagField.append(tagRow);
  modal.append(tagField);

  // ERROR
  const errBox = el('div', { class: 'modal-error' });
  errBox.style.display = 'none';
  modal.append(errBox);

  // ACTIONS
  const actions = el('div', { class: 'modal-actions' });
  const cancelBtn = el('button', { class: 'modal-btn', type: 'button' }, 'Cancel');
  const submitBtn = el('button', { class: 'modal-btn primary', type: 'button' }, 'Add Item');
  actions.append(cancelBtn, submitBtn);
  modal.append(actions);

  function close() {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) {
    if (e.key === 'Escape') close();
  }
  cancelBtn.addEventListener('click', close);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) close();
  });
  document.addEventListener('keydown', onKey);

  async function submit() {
    const sectionTitle = sectionSelect.value === '__new__'
      ? sectionInput.value.trim()
      : sectionSelect.value;
    const subsectionTitle = subSelect.value === '__new__'
      ? subInput.value.trim()
      : subSelect.value;
    const desc = descTextarea.value.trim();

    if (!sectionTitle) {
      errBox.textContent = 'Section is required.';
      errBox.style.display = '';
      return;
    }
    if (!desc) {
      errBox.textContent = 'Description is required.';
      errBox.style.display = '';
      return;
    }

    const tagSuffix = [...selectedTags].map(t => ` [${t}]`).join('');
    const itemLine = `- 🔲 **${desc}**${tagSuffix}`;
    const commitMessage = `backlog: add item to ${sectionTitle}` +
      (subsectionTitle ? ` / ${subsectionTitle}` : '');

    submitBtn.disabled = true;
    cancelBtn.disabled = true;
    submitBtn.textContent = 'Adding…';
    errBox.style.display = 'none';

    try {
      const res = await fetch('/api/project-update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          repo: project.repo,
          file: 'docs/status/BACKLOG.md',
          branch: project.branch || 'main',
          section: sectionTitle,
          subsection: subsectionTitle || undefined,
          item: itemLine,
          commitMessage,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        errBox.textContent = data.error || `Request failed (${res.status})`;
        errBox.style.display = '';
        submitBtn.disabled = false;
        cancelBtn.disabled = false;
        submitBtn.textContent = 'Add Item';
        return;
      }
      close();
      // Invalidate and re-fetch the backlog so the new item shows up.
      if (cache[project.repo]) delete cache[project.repo].backlog;
      if (project.repo === selectedRepo) renderLevelB();
      const refreshed = await fetchBacklog(project.repo);
      if (refreshed.aborted) return;
      storeBacklog(project.repo, refreshed);
      if (project.repo === selectedRepo) renderLevelB();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = '';
      submitBtn.disabled = false;
      cancelBtn.disabled = false;
      submitBtn.textContent = 'Add Item';
    }
  }
  submitBtn.addEventListener('click', submit);

  overlay.append(modal);
  document.body.append(overlay);
  setTimeout(() => descTextarea.focus(), 50);
}

// ─── Tools panel (mobile-only, §7.2) ─────────────────────────────────

function renderTools() {
  const panel = document.getElementById('panelTools');
  panel.innerHTML = '';
  const project = PROJECTS.find(p => p.repo === selectedRepo);
  const tools = project?.tools || [];
  if (tools.length === 0) {
    panel.classList.add('empty');
    return;
  }
  panel.classList.remove('empty');
  panel.append(el('div', { class: 'panel-header' }, 'Tools'));
  const list = el('div', { class: 'tools-list' });
  for (const t of tools) {
    list.append(el('a', {
      class: 'tools-link',
      href: t.url,
      target: '_blank',
      rel: 'noopener',
    }, t.name));
  }
  panel.append(list);
}

// ─── Sync (topbar inline) ────────────────────────────────────────────

function getMachineStatus(m) {
  if (!m) return { dotClass: 'absent', label: 'Not cloned' };
  if ((m.dirty || 0) > 0) return { dotClass: 'dirty', label: `${m.dirty} dirty` };
  if ((m.behind || 0) > 0) return { dotClass: 'behind', label: `${m.behind} behind` };
  if (m.status === 'dirty') return { dotClass: 'dirty', label: 'Dirty' };
  if (m.status === 'behind') return { dotClass: 'behind', label: 'Behind' };
  return { dotClass: 'clean', label: 'Clean' };
}

function renderSync() {
  const wrap = document.getElementById('topbarSync');
  if (!wrap) return;
  wrap.innerHTML = '';

  // Silent when loading or on error — nothing in the topbar.
  if (!syncCache || syncCache.error) return;

  const repoEntry = (syncCache.repos || []).find(r => r.name === selectedRepo);
  if (!repoEntry) return;

  for (const { key, label } of MACHINES) {
    const machineData = repoEntry.machines?.[key];
    const { dotClass, label: statusLabel } = getMachineStatus(machineData);
    const item = el('div', { class: 'topbar-sync-item', title: label });
    item.append(el('span', { class: `sync-dot ${dotClass}` }));
    item.append(document.createTextNode(statusLabel));
    wrap.append(item);
  }
}

// ─── Fetching (§8) ───────────────────────────────────────────────────

async function fetchProjectFile(repo, file, signal, options = {}) {
  const project = PROJECTS.find(p => p.repo === repo);
  const branch = project?.branch || 'main';
  const url = `/api/project-status?repo=${encodeURIComponent(repo)}&file=${encodeURIComponent(file)}&branch=${encodeURIComponent(branch)}`;
  const debug = options.debug;
  if (debug) console.log(`[${debug}] fetch`, { repo, branch, path: file, url });
  try {
    const res = await fetch(url, { signal });
    if (debug) console.log(`[${debug}] response`, { repo, status: res.status });
    if (res.status === 404) return { notFound: true };
    if (!res.ok) return { error: `HTTP ${res.status}` };
    const data = await res.json();
    if (!data.ok) {
      if (debug) console.log(`[${debug}] api error`, { repo, error: data.error });
      return { error: data.error || 'Unknown error' };
    }
    return { content: data.content, fetchedAt: data.fetchedAt };
  } catch (err) {
    if (err.name === 'AbortError' || signal?.aborted) return { aborted: true };
    if (debug) console.log(`[${debug}] error`, { repo, message: err.message });
    return { error: err.message };
  }
}

function fetchBuildStatus(repo, signal) {
  return fetchProjectFile(repo, 'docs/status/BUILD_STATUS.md', signal);
}

function fetchBacklog(repo, signal) {
  return fetchProjectFile(repo, 'docs/status/BACKLOG.md', signal, { debug: 'backlog' });
}

async function fetchSyncStatus() {
  try {
    const res = await fetch('/api/sync-status');
    if (!res.ok) return { error: `HTTP ${res.status}` };
    return await res.json();
  } catch (err) {
    return { error: err.message };
  }
}

function storeBuildStatus(repo, result) {
  cache[repo] = cache[repo] || {};
  cache[repo].buildStatus = result;
}

function storeBacklog(repo, result) {
  cache[repo] = cache[repo] || {};
  cache[repo].backlog = result;
}

async function loadProject(repo, signal) {
  if (repo === selectedRepo) {
    renderLevelA();
    renderLevelB();
  }

  const tasks = [];
  if (!cache[repo]?.buildStatus) {
    tasks.push(fetchBuildStatus(repo, signal).then(r => {
      if (r.aborted) return;
      storeBuildStatus(repo, r);
      renderSidebar();
      if (repo === selectedRepo) renderLevelA();
    }));
  }
  if (!cache[repo]?.backlog) {
    tasks.push(fetchBacklog(repo, signal).then(r => {
      if (r.aborted) return;
      storeBacklog(repo, r);
      if (repo === selectedRepo) renderLevelB();
    }));
  }
  await Promise.all(tasks);
}

async function refreshAll() {
  if (!confirmDiscardPending('refresh')) return;
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  currentLoadController.abort();
  currentLoadController = new AbortController();
  const signal = currentLoadController.signal;
  try {
    for (const p of PROJECTS) {
      if (cache[p.repo]) {
        delete cache[p.repo].buildStatus;
        if (p.repo === selectedRepo) delete cache[p.repo].backlog;
      }
    }
    syncCache = null;
    renderLevelA();
    renderLevelB();
    renderSync();

    const tasks = PROJECTS.map(async (p) => {
      const r = await fetchBuildStatus(p.repo, signal);
      if (r.aborted) return;
      storeBuildStatus(p.repo, r);
    });
    tasks.push(fetchBacklog(selectedRepo, signal).then(r => {
      if (r.aborted) return;
      storeBacklog(selectedRepo, r);
    }));
    tasks.push(fetchSyncStatus().then(r => { syncCache = r; }));
    await Promise.all(tasks);

    if (signal.aborted) return;
    renderSidebar();
    renderLevelA();
    renderLevelB();
    renderSync();
  } finally {
    btn.classList.remove('spinning');
  }
}

document.getElementById('refreshBtn').addEventListener('click', refreshAll);

// ─── Init ────────────────────────────────────────────────────────────

renderSidebar();
renderLevelA();
renderLevelB();
renderSync();
renderTools();
loadProject(selectedRepo, currentLoadController.signal);
fetchSyncStatus().then(r => { syncCache = r; renderSync(); });
</script>
