<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — CVEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-hover: #f6f8fa;
    --border: #dde1e8;
    --border-subtle: #e8ecf0;
    --text: #1a1b22;
    --text-mid: #4a4b58;
    --text-muted: #8a8b98;
    --accent-green: #4caf50;
    --accent-yellow: #f5a623;
    --dot-inactive: #ccd0d8;
    --radius: 12px;
    --radius-sm: 8px;
    --sans: 'Barlow', system-ui, sans-serif;
    --condensed: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    padding: 32px 24px 80px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .brand h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .brand .tag {
    font-family: var(--condensed);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    background: rgba(0, 0, 0, 0.04);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .refresh-btn {
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-mid);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .refresh-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
    align-items: flex-start;
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
  }

  .sidebar-item.selected {
    background: var(--surface);
    border-color: var(--border);
  }

  .sidebar-item-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .sidebar-item.selected .sidebar-item-name {
    font-weight: 600;
  }

  .sidebar-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-inactive);
    flex-shrink: 0;
  }

  .sidebar-dot.active { background: var(--accent-green); }

  .main {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .panel-header {
    font-family: var(--condensed);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .panel-placeholder {
    font-size: 14px;
    color: var(--text-muted);
  }

  .footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: var(--condensed);
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 768px) {
    .page { padding: 24px 16px 60px; }

    .grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .sidebar {
      flex-direction: row;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .sidebar-item {
      flex-shrink: 0;
      padding: 8px 14px;
    }

    .panel { padding: 16px; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">
      <h1>Command Center</h1>
      <span class="tag">internal</span>
    </div>
    <button class="refresh-btn" id="refreshBtn">Refresh All</button>
  </div>

  <div class="grid">
    <aside class="sidebar" id="sidebar"></aside>

    <section class="main">
      <div class="panel">
        <div class="panel-header">Status</div>
        <div class="panel-placeholder">Status will appear here.</div>
      </div>
      <div class="panel">
        <div class="panel-header">Sync</div>
        <div class="panel-placeholder">Sync status will appear here.</div>
      </div>
      <div class="panel">
        <div class="panel-header">Backlog</div>
        <div class="panel-placeholder">Backlog will appear here.</div>
      </div>
    </section>
  </div>

  <div class="footer">
    <span>Civil Engine LLC</span>
    <span>cven.cc/central</span>
  </div>

</div>

<script>
const PROJECTS = [
  {
    name: 'NextGM',
    repo: 'football-sim',
    desc: 'Football GM simulation',
    tools: [
      { name: 'Avatar Forge', url: '/nextgm/avatar-forge' },
      { name: 'Avatar Forge Guide', url: '/nextgm/avatar-forge-guide' },
    ],
  },
  { name: 'XOI', repo: 'xoi-mobile', desc: 'NFL analytics platform', tools: [] },
  { name: 'StoryEngine', repo: 'storyengine', desc: 'Narrative engine', tools: [] },
  { name: 'XOPlay', repo: 'xoplay-ffl', desc: 'Fantasy football league', tools: [] },
  { name: 'Velocity', repo: 'velocity-002', desc: 'Idea refinement tool', tools: [] },
  { name: 'Elemental Web', repo: 'elemental-web', desc: 'Design tool', tools: [] },
  { name: 'CVEN', repo: 'cven', desc: 'Internal tools & worker', tools: [] },
];

let selectedRepo = PROJECTS[0].repo;

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = PROJECTS.map(p => `
    <div class="sidebar-item${p.repo === selectedRepo ? ' selected' : ''}" data-repo="${p.repo}">
      <span class="sidebar-item-name">${p.name}</span>
      <span class="sidebar-dot"></span>
    </div>
  `).join('');
}

renderSidebar();
</script>
</body>
</html>
